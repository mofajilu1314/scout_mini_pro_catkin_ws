# 全局代价地图 - ROS Noetic
# robot_base_frame 用 base_footprint（通过 static_transform 与 Gazebo 的 scout_mini_pro/base_footprint 已接上）
# costmap_2d 未设置 width/height 时默认为 5x5、原点 (0,0)，机器人若在负坐标会报“robot off global costmap”
# 必须与 maps/room.yaml 一致：origin、resolution，尺寸略大于地图 (357*0.05≈17.85, 291*0.05≈14.55)
# 显式指定 plugins 确保加载 static_layer（订阅 /map 并 resize），否则可能只加载 obstacle/inflation，导致 costmap 不发布或范围错误

global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 2.0
  publish_frequency: 2.0
  transform_tolerance: 1.0
  static_map: true
  resolution: 0.05
  width: 18
  height: 15
  origin_x: -8.665620
  origin_y: -7.756701
  plugins:
    - {name: static_layer, type: costmap_2d::StaticLayer}
    - {name: obstacle_layer, type: costmap_2d::ObstacleLayer}
    - {name: inflation_layer, type: costmap_2d::InflationLayer}
  map_topic: /map
