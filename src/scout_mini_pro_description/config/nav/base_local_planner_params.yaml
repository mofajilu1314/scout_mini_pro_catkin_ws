# base_local_planner 参数 - ROS Noetic
# 对应教材“控制器”速度与容差；仿真激光频率低时角速度已适当降低

controller_frequency: 10.0
meter_scoring: true
goal_frame_id: base_footprint

xy_goal_tolerance: 0.15
yaw_goal_tolerance: 0.15

max_vel_x: 0.5
min_vel_x: -0.1
max_vel_theta: 0.8
min_vel_theta: -0.8
theta_stopped_velocity: 0.1

acc_lim_x: 0.5
acc_lim_theta: 2.0

holonomic_robot: false
