# 局部代价地图 - ROS Noetic
# global_frame: odom（通过 static_transform 与 scout_mini_pro/odom 已接上）

local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 1.0
  static_map: false
  rolling_window: true
  width: 4
  height: 4
  resolution: 0.05
