# AMCL 参数（ROS Noetic）- Scout Mini Pro 仿真导航
# 使用无前缀的 map/odom/base_footprint，通过 launch 中 static_transform odom->scout_mini_pro/odom 与 Gazebo TF 衔接
# odom 话题在启动时 remap 到 /scout_mini_pro/odom

base_frame_id: base_footprint
global_frame_id: map
odom_frame_id: odom
use_sim_time: true

odom_model_type: diff
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.8
odom_alpha4: 0.2
odom_alpha5: 0.1

gui_publish_rate: 10.0
laser_max_beams: 30
min_particles: 500
max_particles: 5000
kld_err: 0.05
kld_z: 0.99

laser_model_type: likelihood_field
laser_z_hit: 0.5
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.5
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_likelihood_max_dist: 2.0

update_min_d: 0.2
update_min_a: 0.5
resample_interval: 1
transform_tolerance: 0.5
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0
