/**:
  ros__parameters:
    # Real Scout (ROS1 on robot; this yaml documents Humble-side topic contract)
    cloud_topic: /rslidar_points
    input_odom_topic: /Odometry
    output_odom_topic: /long_nav/odom
    # FAST-LIO2 typical out; remap in launch when vendor is installed
    fastlio_odom_topic: /Odometry
    imu_topic: /imu/data
    frame_id: odom
    use_sim_time: false
    # Extrinsics placeholders (fill after calibration)
    lidar_to_imu_tx: 0.0
    lidar_to_imu_ty: 0.0
    lidar_to_imu_tz: 0.0
    lidar_to_imu_roll: 0.0
    lidar_to_imu_pitch: 0.0
    lidar_to_imu_yaw: 0.0
